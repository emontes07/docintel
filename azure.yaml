# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: visionary-lab
metadata:
  template: visionary-lab@0.0.1-beta
services:
  backend:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./backend/Dockerfile
      context: .
      remoteBuild: true
  frontend:
    project: ./frontend
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

hooks:
  postprovision:
    posix:
      shell: sh
      run: |
        echo "Infrastructure provisioned successfully"
        echo "Approving Front Door private link connection to storage account..."
        STORAGE_NAME=$(azd env get-value AZURE_STORAGE_ACCOUNT_NAME 2>/dev/null || echo "")
        if [ -n "$STORAGE_NAME" ]; then
          PE_CONN_ID=$(az storage account show --name "$STORAGE_NAME" --query "privateEndpointConnections[?privateLinkServiceConnectionState.status=='Pending'].id" -o tsv 2>/dev/null | head -1)
          if [ -n "$PE_CONN_ID" ]; then
            az network private-endpoint-connection approve --id "$PE_CONN_ID" --description "Approved by azd postprovision" 2>/dev/null && echo "Private link connection approved." || echo "Warning: Could not auto-approve private link. Approve manually in Azure Portal."
          else
            echo "No pending private link connections found (may already be approved)."
          fi
        fi
    windows:
      shell: pwsh
      run: |
        Write-Host "Infrastructure provisioned successfully"
        Write-Host "Approving Front Door private link connection to storage account..."
        $storageName = azd env get-value AZURE_STORAGE_ACCOUNT_NAME 2>$null
        if ($storageName) {
          $peConnId = az storage account show --name $storageName --query "privateEndpointConnections[?privateLinkServiceConnectionState.status=='Pending'].id" -o tsv 2>$null | Select-Object -First 1
          if ($peConnId) {
            az network private-endpoint-connection approve --id $peConnId --description "Approved by azd postprovision" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "Private link connection approved." } else { Write-Host "Warning: Could not auto-approve private link. Approve manually in Azure Portal." }
          } else {
            Write-Host "No pending private link connections found (may already be approved)."
          }
        }

infra:
  provider: bicep
  path: infra

pipeline:
  provider: github
